[project]
name = "churn-experimentation"
version = "0.1.0"
description = "A/B analysis of the Hillstrom email experiment + churn follow-up design"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abtest", "src/churn"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["2_Entregable-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
